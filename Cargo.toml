[package]
name = "synthon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Fast, low-memory, read-only Markdown viewer for Linux with mermaid diagrams and syntax highlighting"
license = "MIT"
repository = "https://github.com/initialrise/synthon"
readme = "README.md"
keywords = ["markdown", "viewer", "mermaid", "egui", "linux"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
epaint = { version = "0.37", default-features = false, features = ["color_fonts"] }
memmap2 = "0.9"
merman = { version = "=0.10.0-alpha.2", default-features = false, features = ["all-diagrams", "svg", "layout-cytoscape"] }
pulldown-cmark = { version = "0.13", default-features = false }
resvg = "0.49"
serde_json = "1"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
